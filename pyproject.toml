# Tooling configuration only. The skills are not a Python package: every script in
# skills/*/scripts/ is a standalone, standard-library-only file.
[project]
name = "vps-devops-skills"
version = "0.1.0"
description = "Agent Skills for running Linux servers safely"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Saizul Amin" }]

[tool.ruff]
line-length = 110
target-version = "py38"
extend-exclude = ["dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL"]
ignore = [
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLW2901",
  "SIM102", "SIM103", "SIM108", "SIM110", "SIM117", "PLC0415", "UP006", "UP007", "UP035", "UP045",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["conftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
