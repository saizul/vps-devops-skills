name: Improve a skill
description: A new check, a better workflow step, a missing edge case or clearer docs
labels: ["enhancement"]
body:
  - type: input
    id: skill
    attributes:
      label: Skill
      placeholder: "nginx-config-review"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What should change and why?
      description: For a new check, include an example input that should (and should not) trigger it.
    validations:
      required: true
